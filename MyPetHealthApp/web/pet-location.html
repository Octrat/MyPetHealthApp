<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Питомец найден! 🐾</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 32px;
            padding: 32px 24px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        .emoji {
            font-size: 64px;
            margin-bottom: 16px;
        }
        
        h1 {
            font-size: 28px;
            color: #2F4F4F;
            margin-bottom: 8px;
        }
        
        .pet-name {
            color: #7BC9A8;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 16px;
        }
        
        .pet-info {
            background: #F8FCFA;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 24px;
            text-align: left;
        }
        
        .pet-info p {
            margin: 8px 0;
            color: #2F4F4F;
        }
        
        .btn {
            background: #7BC9A8;
            border: none;
            padding: 16px 24px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
            transition: transform 0.2s, opacity 0.2s;
        }
        
        .btn:hover {
            transform: scale(1.02);
            opacity: 0.9;
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        .btn-secondary {
            background: #E8F0EC;
            color: #2F4F4F;
        }
        
        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 16px;
            font-size: 14px;
            display: none;
        }
        
        .status.success {
            background: #D4EDDA;
            color: #155724;
            display: block;
        }
        
        .status.error {
            background: #F8D7DA;
            color: #721C24;
            display: block;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: #A0B8B0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🐕</div>
        <h1>Питомец найден!</h1>
        <div class="pet-name" id="petName">Загрузка...</div>
        
        <div class="pet-info" id="petInfo">
            <p>🔄 Загрузка информации...</p>
        </div>
        
        <button class="btn" id="sendLocationBtn">
            📍 Отправить моё местоположение
        </button>
        
        <button class="btn btn-secondary" id="copyPhoneBtn">
            📞 Скопировать телефон владельца
        </button>
        
        <div id="status" class="status"></div>
        <div class="footer">
            Этот QR-код создан в HealthyPaws для быстрого поиска хозяина питомца
        </div>
    </div>

    <script>
        // Получаем ID питомца из URL
        const urlParams = new URLSearchParams(window.location.search);
        const petId = urlParams.get('id');
        
        let ownerPhone = '';
        let ownerEmail = '';
        
        // API URL (замени на свой IP)
        const API_URL = 'http://192.168.0.34:3001';
        
        async function loadPetInfo() {
            if (!petId) {
                document.getElementById('petName').textContent = 'Ошибка';
                document.getElementById('petInfo').innerHTML = '<p>❌ Неверная ссылка</p>';
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/api/public/pet/${petId}`);
                const data = await response.json();
                
                if (response.ok && data.pet) {
                    document.getElementById('petName').textContent = data.pet.name;
                    ownerPhone = data.contact.phone || '';
                    ownerEmail = data.contact.email || '';
                    
                    let petInfoHtml = `
                        <p>🐶 <strong>Вид:</strong> ${data.pet.species === 'dog' ? 'Собака' : 'Кошка'}</p>
                        <p>🐕 <strong>Порода:</strong> ${data.pet.breed_name || 'Не указана'}</p>
                        <p>⚖️ <strong>Вес:</strong> ${data.pet.weight || '?'} кг</p>
                        <p>🎂 <strong>Возраст:</strong> ${data.pet.age || '?'} лет</p>
                    `;
                    
                    if (data.pet.description) {
                        petInfoHtml += `<p>📝 <strong>Особые приметы:</strong> ${data.pet.description}</p>`;
                    }
                    
                    if (data.contact.ownerName) {
                        petInfoHtml += `<p>👤 <strong>Владелец:</strong> ${data.contact.ownerName}</p>`;
                    }
                    
                    document.getElementById('petInfo').innerHTML = petInfoHtml;
                } else {
                    throw new Error('Питомец не найден');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                document.getElementById('petName').textContent = 'Ошибка';
                document.getElementById('petInfo').innerHTML = '<p>❌ Не удалось загрузить информацию</p>';
            }
        }
        
        async function sendLocation() {
            if (!navigator.geolocation) {
                showStatus('Геолокация не поддерживается вашим браузером', 'error');
                return;
            }
            
            const btn = document.getElementById('sendLocationBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Определение местоположения...';
            
            navigator.geolocation.getCurrentPosition(async (position) => {
                const { latitude, longitude } = position.coords;
                
                btn.innerHTML = '<span class="loading"></span> Отправка...';
                
                try {
                    const response = await fetch(`${API_URL}/api/report-location`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            petId: parseInt(petId),
                            latitude: latitude,
                            longitude: longitude,
                            timestamp: new Date().toISOString()
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        showStatus('✅ Спасибо! Владельцу отправлено уведомление с вашими координатами.', 'success');
                        btn.innerHTML = '📍 Отправлено!';
                    } else {
                        throw new Error(data.message || 'Ошибка отправки');
                    }
                } catch (error) {
                    console.error('Ошибка:', error);
                    showStatus('❌ Не удалось отправить местоположение. Попробуйте позже.', 'error');
                    btn.innerHTML = '📍 Отправить моё местоположение';
                    btn.disabled = false;
                }
            }, (error) => {
                console.error('Geolocation error:', error);
                let errorMsg = 'Не удалось определить местоположение. ';
                if (error.code === 1) errorMsg += 'Пожалуйста, разрешите доступ к геолокации.';
                else if (error.code === 2) errorMsg += 'Позиция недоступна.';
                else if (error.code === 3) errorMsg += 'Таймаут. Попробуйте ещё раз.';
                
                showStatus('❌ ' + errorMsg, 'error');
                btn.innerHTML = '📍 Отправить моё местоположение';
                btn.disabled = false;
            }, {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            });
        }
        
        function copyPhone() {
            if (!ownerPhone) {
                showStatus('📞 Телефон владельца не указан', 'error');
                return;
            }
            
            navigator.clipboard.writeText(ownerPhone).then(() => {
                showStatus('📞 Телефон скопирован! Свяжитесь с владельцем.', 'success');
            }).catch(() => {
                showStatus('❌ Не удалось скопировать телефон', 'error');
            });
        }
        
        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            setTimeout(() => {
                statusDiv.className = 'status';
            }, 5000);
        }
        
        // Загружаем информацию о питомце
        loadPetInfo();
        
        // Назначаем обработчики
        document.getElementById('sendLocationBtn').onclick = sendLocation;
        document.getElementById('copyPhoneBtn').onclick = copyPhone;
    </script>
</body>
</html>
